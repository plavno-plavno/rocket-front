asyncapi: 3.0.0
info:
  title: Local Presence Platform — events
  version: 0.2.0-draft
  description: 'Events between core-api, sync-engine, matching, connector-runtime, stats-collector and rank-tracker (SDD-00 §7). Transport: NATS JetStream stream `lp-events`, subject `lp.events.<type>`.
    Guarantees: at-least-once, ordering per key (see `x-key`), consumers idempotent by `event_id`. Services never read each other''s databases, so events carry the data consumers need (canonical location,
    account descriptor, whole review). TypeScript twin: `@lp/contracts` `src/events.ts`.'
defaultContentType: application/json
servers:
  nats:
    host: nats:4222
    protocol: nats
    description: JetStream, stream lp-events (subjects lp.events.>)
