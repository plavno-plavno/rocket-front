        total: { type: integer }
        positive: { type: integer }
        negative: { type: integer }
        neutral: { type: integer }
        without_rating: { type: integer }
        average_rating: { type: [number, 'null'] }
        answered: { type: integer }
    RegionStat:
      type: object
      required: [region_code, region_name, country, total]
      properties:
        region_code: { type: string, description: ISO 3166-2 }
        region_name: { type: string }
        country: { type: string }
        total: { type: integer }
        average_rating: { type: [number, 'null'] }
        negative_share: { type: [number, 'null'] }
    RankingRow:
      type: object
      description: Generic ranking row for Локации / Города / Теги / Фразы / Темы.
      required: [key, label, total]
      properties:
        key: { type: string }
        label: { type: string }
        total: { type: integer }
        positive: { type: integer }
        negative: { type: integer }
        average_rating: { type: [number, 'null'] }
        answered_share: { type: [number, 'null'] }
        trend_percent: { type: [number, 'null'] }
        sentiment: { $ref: '#/components/schemas/Sentiment' }
