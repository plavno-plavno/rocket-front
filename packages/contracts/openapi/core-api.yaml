        publish: { type: boolean, default: true, description: '`false` saves a draft.' }
    ReviewReplyUpdate:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1 }
        publish: { type: boolean, default: true }
    ReviewNote:
      type: object
      required: [id, review_id, user_id, text, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        review_id: { $ref: '#/components/schemas/Id' }
        user_id: { $ref: '#/components/schemas/Id' }
