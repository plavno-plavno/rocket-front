        id: { $ref: '#/components/schemas/Id' }
        type: { $ref: '#/components/schemas/PublicationType' }
        title: { type: [string, 'null'] }
        text: { type: string }
        media_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
        cta:
          type: [object, 'null']
          properties:
            kind: { type: string, enum: [call, website, book, order, learn_more] }
            url: { type: [string, 'null'] }
        platform_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
        scope: { type: string }
        location_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
        schedule_at: { type: [string, 'null'], format: date-time }
        starts_at: { type: [string, 'null'], format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        state: { $ref: '#/components/schemas/PublicationState' }
        results: { type: array, items: { $ref: '#/components/schemas/PublicationResult' } }
        created_by: { type: [string, 'null'] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    PublicationCreate:
      type: object
      required: [type, text, platform_ids]
      properties:
        type: { $ref: '#/components/schemas/PublicationType' }
        title: { type: [string, 'null'] }
        text: { type: string }
        media_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
        cta: { $ref: '#/components/schemas/Publication/properties/cta' }
        platform_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
        scope: { type: string, default: all }
        location_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
        schedule_at: { type: [string, 'null'], format: date-time }
        starts_at: { type: [string, 'null'], format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        state:
          type: string
          enum: [draft, scheduled, publish]
          description: 'Default `publish`. `draft` keeps the post unpublished, `scheduled` requires `schedule_at`, `publish` sends now (or at `schedule_at` when in the future).'
    MediaUpload:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
        kind: { $ref: '#/components/schemas/MediaKind' }
        location_ids:
          type: array
          items: { $ref: '#/components/schemas/Id' }
          description: Locations the asset is attached to — repeated form fields or one comma-separated value.
    MediaAsset:
      type: object
      required: [id, kind, url, width, height, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/MediaKind' }
        url: { type: string }
        thumbnail_url: { type: [string, 'null'] }
        width: { type: integer }
        height: { type: integer }
        size_bytes: { type: integer }
        location_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    ListingMedia:
      type: object
      description: Photo observed on a listing (own or UGC).
      required: [id, listing_id, location_id, platform_id, origin, state, url]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        listing_id: { $ref: '#/components/schemas/Id' }
        location_id: { $ref: '#/components/schemas/Id' }
        platform_id: { $ref: '#/components/schemas/Id' }
        media_asset_id: { type: [string, 'null'] }
        external_id: { type: [string, 'null'] }
        origin: { $ref: '#/components/schemas/MediaOrigin' }
        state: { $ref: '#/components/schemas/ListingMediaState' }
        url: { type: string }
        thumbnail_url: { type: [string, 'null'] }
        author_name: { type: [string, 'null'] }
        observed_at: { $ref: '#/components/schemas/Timestamp' }
    ListingMediaAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [flag, delete] }
        reason: { type: string }
    Product:
      type: object
      required: [id, name, category, price, location_scope, sync_state]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        category: { type: string }
        description: { type: [string, 'null'] }
        price: { $ref: '#/components/schemas/Money' }
        media_id: { type: [string, 'null'] }
        image_url: { type: [string, 'null'] }
        location_scope: { type: string }
        location_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
        sync_state:
          type: object
          required: [synced, sent, failed]
          properties:
            synced: { type: integer }
            sent: { type: integer }
            failed: { type: integer }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
