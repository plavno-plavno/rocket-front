        created_at: { $ref: '#/components/schemas/Timestamp' }
    WidgetUpsert:
      type: object
      required: [kind, name]
      properties:
        kind: { $ref: '#/components/schemas/WidgetKind' }
        name: { type: string }
        config: { $ref: '#/components/schemas/WidgetConfig' }
        allowed_domains: { type: array, items: { type: string } }
    WidgetConfig:
      type: object
      description: Per-kind options (`reviews` → theme/min_rating/platforms/limit, `store_locator` → theme/default_city/show_hours); unknown keys are kept.
      properties:
        theme: { type: string, enum: [light, dark], description: Default light }
