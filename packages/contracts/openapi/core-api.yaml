openapi: 3.1.0
info:
  title: Local Presence Platform — core-api
  version: 0.2.0-draft
  description: |
    Draft of the UI ↔ core-api boundary (SDD-00 §8), authored by the UI track so that the
    frontend can be built against a mock server. To be moved to the contracts repository
    and reviewed by the core-api owner before freeze v0.1.

    Conventions (SDD-00 §2, §8):
    - IDs are ULIDs with a type prefix (`tnt_`, `usr_`, `loc_`, `grp_`, `plt_`, `pac_`, `lst_`, `rev_`, `rpl_`, `tpl_`, `tag_`, `job_`, `op_`).
    - Timestamps are UTC ISO-8601.
    - UI tables use page pagination (`page`, `page_size`); feeds use cursor pagination (`cursor`, `limit`).
    - Filters are `filter[field]=value`; the global scope is `scope=grp_…|all`.
    - Errors are RFC 9457 problem documents.
servers:
  - url: /api/core
    description: Same-origin rewrite from the web app to core-api
tags:
  - name: auth
  - name: session
  - name: tenants
  - name: users
  - name: locations
  - name: listings
  - name: platforms
  - name: sources
  - name: reviews
  - name: templates
  - name: tags
  - name: auto-replies
  - name: ai-replies
  - name: questions
  - name: publications
  - name: media
  - name: products
  - name: review-generation
  - name: widgets
  - name: review-analytics
  - name: presence
  - name: rank
  - name: duplicates
  - name: notifications
  - name: integrations
  - name: exports

# ───────────────────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: lp_session

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 25 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Sort:
      name: sort
      in: query
      description: Comma-separated fields, prefix `-` for descending (`-created_at,name`).
      schema: { type: string }
    Scope:
      name: scope
      in: query
      description: Global location scope — `all` or a `grp_…` id (SCR-1 "Все компании").
      schema: { type: string, default: all }
    Search:
      name: q
      in: query
      schema: { type: string }
    PeriodFrom:
      name: from
      in: query
      required: true
      schema: { type: string, format: date }
    PeriodTo:
      name: to
      in: query
      required: true
      schema: { type: string, format: date }
    Granularity:
      name: granularity
      in: query
      schema: { type: string, enum: [day, week, month], default: day }
    CompareFrom:
      name: compare_from
      in: query
      schema: { type: string, format: date }
    CompareTo:
      name: compare_to
      in: query
      schema: { type: string, format: date }
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string }
    MockScenario:
      name: x-mock-scenario
      in: header
      description: Mock server only — selects a scenario (`seed_default`, `challenge_required`, `connector_degraded`, `empty_tenant`).
      schema: { type: string }

  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NoContent:
      description: No content

  schemas:
    # ── common ──────────────────────────────────────────────────────────────
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, examples: ['https://lp.example/problems/validation'] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Machine-readable error code (`validation_failed`, `not_found`, `forbidden`, `conflict`, `capability_unavailable`, …).
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    PageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    CursorMeta:
      type: object
      properties:
        next_cursor: { type: [string, 'null'] }
    Money:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor: { type: integer }
        currency: { type: string, minLength: 3, maxLength: 3 }
    Id:
      type: string
      description: Prefixed ULID
    Timestamp:
      type: string
      format: date-time
    LocaleCode:
      type: string
      description: BCP-47
      examples: [ru, en]

    # ── enums (SDD-00 §3, §5) ────────────────────────────────────────────────
    Role:
      type: string
      enum: [owner, admin, reputation_manager, observer]
    UserStatus:
      type: string
      enum: [invited, active, disabled]
    Action:
      type: string
      description: Permission action identifiers (SDD-00 §3.8).
      enum:
        - tenant.billing
        - users.manage
        - accounts.manage
        - integrations.manage
        - locations.read
        - locations.edit
        - publications.edit
        - reviews.read
        - reviews.reply
        - reviews.complain
        - templates.team
        - templates.private
        - analytics.read
    PlanFeature:
      type: string
      enum: [auto_replies, ai_replies, review_generation, rank_tracker, communication, store_locator, widgets, products, api_access]
    PlatformKind:
      type: string
      enum: [map, navigator, catalog, social, review_site, delivery]
    PlatformAccountAuthKind:
      type: string
      enum: [oauth, partner_key, credentials, none]
    PlatformAccountStatus:
      type: string
      enum: [ok, reauth_required, challenge_required, revoked]
    ConnectorHealth:
      type: string
      enum: [ok, degraded, down]
    SyncStatus:
      type: string
      enum: [synced, sent, action_required, not_connected, unsupported, error]
    ActionReason:
      type: string
      enum:
        - verification_required
        - access_lost
        - challenge_required
        - moderation_rejected
        - conflicting_owner
        - listing_suspended
        - drift_needs_decision
        - duplicate_detected
        - manual_task_pending
    MatchState:
      type: string
      enum: [candidate, auto_confirmed, needs_review, confirmed, rejected, duplicate_of, suspected_fake]
    ListingOwnership:
      type: string
      enum: [owned, claimable, unclaimed, foreign]
    ListingVerification:
      type: string
      enum: [verified, pending, unverified, suspended]
    SyncOperationState:
      type: string
      enum: [queued, dispatched, sent, pending_moderation, confirmed, rejected, partially_applied, superseded, failed_retryable, failed_terminal]
    LocationStatus:
      type: string
      enum: [open, temporarily_closed, permanently_closed, coming_soon]
    LocationGroupKind:
      type: string
      enum: [brand, region, city, custom]
    ReviewPlatformState:
      type: string
      enum: [visible, edited, deleted_by_author, removed_by_platform]
    ReviewWorkflowStatus:
      type: string
      description: SDD-00 §5.4, exact reference set is [H-UI-02]
      enum: [new, in_progress, resolved, no_reply_needed, escalated]
    ReplyOrigin:
      type: string
      enum: [manual, template, auto, ai, platform_imported]
    ReplyState:
      type: string
      enum: [draft, requested, published, failed, deleted]
    ComplaintState:
      type: string
      enum: [requested, submitted, accepted, rejected, unknown]
    Sentiment:
      type: string
      enum: [positive, neutral, negative]
    TemplateVisibility:
      type: string
      enum: [private, team]
    AutoReplyMode:
      type: string
      enum: [draft, publish]
    PublicationType:
      type: string
      enum: [news, offer, event]
    PublicationState:
      type: string
      enum: [draft, scheduled, publishing, published, partially_failed, failed]
    MediaKind:
      type: string
      enum: [photo, video, logo, cover]
    MediaOrigin:
      type: string
      enum: [owner, user_generated]
    ListingMediaState:
      type: string
      enum: [published, pending, rejected, flagged]
    CampaignChannel:
      type: string
      enum: [qr, sms, whatsapp, email, link]
    CampaignRouting:
      type: string
      description: Review gating is forbidden (SDD-00 §3.10).
      enum: [all_to_platforms, platforms_plus_private]
    CampaignStatus:
      type: string
      enum: [draft, active, paused, archived]
    WidgetKind:
      type: string
      enum: [reviews, store_locator]
    Metric:
      type: string
      enum:
        - impressions_maps
        - impressions_search
        - impressions_total
        - actions_calls
        - actions_website
        - actions_directions
        - actions_other
        - actions_bookings
        - actions_menu
        - conversations
    DuplicateKind:
      type: string
      enum: [duplicate, fake, conflicting_owner]
    DuplicateState:
      type: string
      enum: [open, confirmed, dismissed, merged, reported]
    NotificationType:
      type: string
      enum: [negative_review, unanswered_review, action_required, batch_finished, account_issue, system]
    NotificationChannel:
      type: string
      enum: [email, telegram, web_push]
    ExportState:
      type: string
      enum: [queued, running, done, failed]
    BatchState:
      type: string
      enum: [queued, running, done, partially_failed, failed]

    # ── identity & tenancy (SDD-00 §3.1) ────────────────────────────────────
    AccessRule:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [all, locations, groups] }
        location_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
        group_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
    AccessRuleSummary:
      type: object
      required: [mode, location_count]
      properties:
        mode: { type: string, enum: [all, locations, groups] }
        location_count: { type: integer }
    Plan:
      type: object
      required: [id, name, features]
      properties:
        id: { type: string }
        name: { type: string }
        features: { type: array, items: { $ref: '#/components/schemas/PlanFeature' } }
        limits:
          type: object
          properties:
            locations: { type: [integer, 'null'] }
            users: { type: [integer, 'null'] }
    Tenant:
      type: object
      required: [id, name, plan, timezone, locale]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        plan: { $ref: '#/components/schemas/Plan' }
        timezone: { type: string, examples: ['Europe/Moscow'] }
        locale: { $ref: '#/components/schemas/LocaleCode' }
        settings:
          type: object
          additionalProperties: true
        created_at: { $ref: '#/components/schemas/Timestamp' }
    TenantUpdate:
      type: object
      properties:
        name: { type: string }
        timezone: { type: string }
        locale: { $ref: '#/components/schemas/LocaleCode' }
        settings: { type: object, additionalProperties: true }
    User:
      type: object
      required: [id, email, name, locale, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        name: { type: string }
        avatar_url: { type: [string, 'null'] }
        locale: { $ref: '#/components/schemas/LocaleCode' }
        status: { $ref: '#/components/schemas/UserStatus' }
        two_factor_enabled: { type: boolean }
    Membership:
      type: object
      description: A user inside the current tenant (Settings → Users, SCR-2).
      required: [user, role, access_rule, status]
      properties:
        user: { $ref: '#/components/schemas/User' }
        role: { $ref: '#/components/schemas/Role' }
        access_rule: { $ref: '#/components/schemas/AccessRule' }
        status: { $ref: '#/components/schemas/UserStatus' }
        last_login_at: { type: [string, 'null'], format: date-time }
        invited_at: { type: [string, 'null'], format: date-time }
    MembershipUpdate:
      type: object
      properties:
        role: { $ref: '#/components/schemas/Role' }
        access_rule: { $ref: '#/components/schemas/AccessRule' }
        status: { type: string, enum: [active, disabled] }
    Invitation:
      type: object
      required: [id, email, role, access_rule, expires_at, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        access_rule: { $ref: '#/components/schemas/AccessRule' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        accepted_at: { type: [string, 'null'], format: date-time }
    InvitationCreate:
      type: object
      required: [emails, role, access_rule]
      properties:
        emails: { type: array, minItems: 1, items: { type: string, format: email } }
        role: { $ref: '#/components/schemas/Role' }
        access_rule: { $ref: '#/components/schemas/AccessRule' }
    InvitationPublic:
      type: object
      description: What an invitee sees before accepting.
      required: [email, tenant_name, role, expires_at]
      properties:
        email: { type: string, format: email }
        tenant_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    Me:
      type: object
      description: Session context for the web app (SDD-01 §2.2).
      required: [user, tenant, role, access_rule, permissions, tenants]
      properties:
        user: { $ref: '#/components/schemas/User' }
        tenant: { $ref: '#/components/schemas/Tenant' }
        role: { $ref: '#/components/schemas/Role' }
        access_rule: { $ref: '#/components/schemas/AccessRuleSummary' }
        permissions: { type: array, items: { $ref: '#/components/schemas/Action' } }
        tenants:
          type: array
          items:
            type: object
            required: [id, name, role]
            properties:
              id: { $ref: '#/components/schemas/Id' }
              name: { type: string }
              role: { $ref: '#/components/schemas/Role' }
    Badges:
      type: object
      description: Dynamic sidebar counters (SDD-01 §7.2).
      required: [reviews_unanswered, duplicates_open, action_required, notifications_unread]
      properties:
        reviews_unanswered: { type: integer }
        duplicates_open: { type: integer }
        action_required: { type: integer }
        notifications_unread: { type: integer }
    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        remember: { type: boolean, default: false }
    SignInResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, two_factor_required] }
        challenge_token: { type: string, description: Present when `status = two_factor_required`. }
    TwoFactorRequest:
      type: object
      required: [challenge_token, code]
      properties:
        challenge_token: { type: string }
        code: { type: string, minLength: 6, maxLength: 6 }
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    PasswordResetConfirm:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, minLength: 8 }
    InvitationAccept:
      type: object
      required: [name, password]
      properties:
        name: { type: string }
        password: { type: string, minLength: 8 }
    SwitchTenantRequest:
      type: object
      required: [tenant_id]
      properties:
        tenant_id: { $ref: '#/components/schemas/Id' }
    ProfileUpdate:
      type: object
      properties:
        name: { type: string }
        locale: { $ref: '#/components/schemas/LocaleCode' }
        avatar_url: { type: [string, 'null'] }
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8 }
    TwoFactorEnrolment:
      type: object
      required: [otpauth_url, secret]
      properties:
        otpauth_url: { type: string, description: 'otpauth:// URI for the QR code' }
        secret: { type: string, description: Base32 secret for manual entry }
    TwoFactorCode:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 6, maxLength: 6 }
    EmailChangeRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    EmailChangeConfirm:
      type: object
      required: [token]
      properties:
        token: { type: string }

    # ── locations (SDD-00 §3.2, §4) ─────────────────────────────────────────
    Address:
      type: object
      required: [country, city]
      properties:
        country: { type: string, minLength: 2, maxLength: 2 }
        region: { type: [string, 'null'] }
        city: { type: string }
        street: { type: [string, 'null'] }
        house: { type: [string, 'null'] }
        building: { type: [string, 'null'] }
        unit: { type: [string, 'null'] }
        postal_code: { type: [string, 'null'] }
        free_form: { type: [string, 'null'] }
        landmark: { type: [string, 'null'] }
        floor: { type: [string, 'null'] }
        fias_id: { type: [string, 'null'] }
    Geo:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number }
        lng: { type: number }
        precision: { type: string, enum: [rooftop, street, city, unknown] }
    Phone:
      type: object
      required: [e164]
      properties:
        e164: { type: string }
        kind: { type: string, enum: [main, additional, fax, whatsapp] }
    SocialLink:
      type: object
      required: [kind, url]
      properties:
        kind: { type: string, enum: [vk, telegram, instagram, facebook, youtube, tiktok, other] }
        url: { type: string, format: uri }
    HoursInterval:
      type: array
      description: '[open, close] in HH:MM'
      items: { type: string }
      minItems: 2
      maxItems: 2
    RegularHours:
      type: object
      required: [days, intervals]
      properties:
        days:
          type: array
          items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
        intervals:
          type: array
          items: { $ref: '#/components/schemas/HoursInterval' }
    SpecialHours:
      type: object
      required: [date]
      properties:
        date: { type: string, format: date }
        intervals:
          type: array
          items: { $ref: '#/components/schemas/HoursInterval' }
        closed: { type: boolean }
    Hours:
      type: object
      properties:
        regular: { type: array, items: { $ref: '#/components/schemas/RegularHours' } }
        special: { type: array, items: { $ref: '#/components/schemas/SpecialHours' } }
    Categories:
      type: object
      required: [primary]
      properties:
        primary: { type: string }
        additional: { type: array, items: { type: string } }
    TaxonomyCategory:
      type: object
      required: [id, name, parent_id, platform_ids]
      properties:
        id: { type: string, examples: [cat_sporting_goods] }
        name: { type: string }
        parent_id: { type: [string, 'null'] }
        platform_ids: { type: array, items: { $ref: '#/components/schemas/Id' }, description: Platforms with a mapping for this category }
    TaxonomyAttribute:
      type: object
      required: [key, name, kind, values]
      properties:
        key: { type: string, examples: [wheelchair_accessible] }
        name: { type: string }
        kind: { type: string, enum: [boolean, enum] }
        values:
          type: array
          items:
            type: object
            required: [value, name]
            properties:
              value: { type: string }
              name: { type: string }
    LocationMedia:
      type: object
      properties:
        logo: { type: [string, 'null'] }
        cover: { type: [string, 'null'] }
        photos: { type: array, items: { $ref: '#/components/schemas/Id' } }
    FieldPolicy:
      type: string
      enum: [enforce, accept_platform, ask]
    LocationPatch:
      type: object
      description: Any subset of the canonical location fields (bulk edit, import) — same properties as `LocationCore`, nothing required.
      properties:
        branch_code: { type: [string, 'null'] }
        name: { type: string }
        brand_group_id: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/LocationStatus' }
        address: { $ref: '#/components/schemas/Address' }
        geo: { $ref: '#/components/schemas/Geo' }
        phones: { type: array, items: { $ref: '#/components/schemas/Phone' } }
        emails: { type: array, items: { type: string, format: email } }
        website: { type: [string, 'null'] }
        social: { type: array, items: { $ref: '#/components/schemas/SocialLink' } }
        hours: { $ref: '#/components/schemas/Hours' }
        categories: { $ref: '#/components/schemas/Categories' }
        attributes:
          type: object
          additionalProperties: { type: [boolean, string, number] }
        description: { type: [string, 'null'] }
        media: { $ref: '#/components/schemas/LocationMedia' }
        platform_overrides:
          type: object
          description: Per-platform overrides of canonical fields, keyed by platform id.
          additionalProperties: { $ref: '#/components/schemas/PlatformOverride' }
        field_policies:
          type: object
          additionalProperties: { $ref: '#/components/schemas/FieldPolicy' }
        timezone: { type: string }
    LocationCore:
      type: object
      description: Canonical location fields (SDD-00 §4) shared by read and write shapes. Keep the property list equal to `LocationPatch`.
      required: [name, status, address]
      properties:
        branch_code: { type: [string, 'null'] }
        name: { type: string }
        brand_group_id: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/LocationStatus' }
        address: { $ref: '#/components/schemas/Address' }
        geo: { $ref: '#/components/schemas/Geo' }
        phones: { type: array, items: { $ref: '#/components/schemas/Phone' } }
        emails: { type: array, items: { type: string, format: email } }
        website: { type: [string, 'null'] }
        social: { type: array, items: { $ref: '#/components/schemas/SocialLink' } }
        hours: { $ref: '#/components/schemas/Hours' }
        categories: { $ref: '#/components/schemas/Categories' }
        attributes:
          type: object
          additionalProperties: { type: [boolean, string, number] }
        description: { type: [string, 'null'] }
        media: { $ref: '#/components/schemas/LocationMedia' }
        platform_overrides:
          type: object
          description: Per-platform overrides of canonical fields, keyed by platform id.
          additionalProperties: { $ref: '#/components/schemas/PlatformOverride' }
        field_policies:
          type: object
          additionalProperties: { $ref: '#/components/schemas/FieldPolicy' }
        timezone: { type: string }
    PlatformOverride:
      type: object
      properties:
        name: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        website: { type: [string, 'null'] }
        phones: { type: array, items: { $ref: '#/components/schemas/Phone' } }
        hours: { $ref: '#/components/schemas/Hours' }
        categories: { $ref: '#/components/schemas/Categories' }
    Location:
      allOf:
        - $ref: '#/components/schemas/LocationCore'
        - type: object
          required: [id, tenant_id, version, group_ids, updated_at, created_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            tenant_id: { $ref: '#/components/schemas/Id' }
            version: { type: integer }
            group_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
            listing_summary: { $ref: '#/components/schemas/ListingStatusCounts' }
            created_at: { $ref: '#/components/schemas/Timestamp' }
            updated_at: { $ref: '#/components/schemas/Timestamp' }
            deleted_at: { type: [string, 'null'], format: date-time }
    LocationListItem:
      type: object
      description: Row of "Мои компании" (SCR-1).
      required: [id, name, status, address, listing_statuses, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        branch_code: { type: [string, 'null'] }
        name: { type: string }
        status: { $ref: '#/components/schemas/LocationStatus' }
        address: { $ref: '#/components/schemas/Address' }
        group_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
        listing_statuses:
          type: array
          items: { $ref: '#/components/schemas/ListingStatusBrief' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    LocationCreate:
      $ref: '#/components/schemas/LocationCore'
    LocationUpdate:
      allOf:
        - $ref: '#/components/schemas/LocationCore'
        - type: object
          required: [version]
          properties:
            version: { type: integer, description: Optimistic locking }
    LocationVersion:
      type: object
      required: [version, author, created_at, changed_fields]
      properties:
        version: { type: integer }
        author:
          type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [user, system, platform] }
            user_id: { type: [string, 'null'] }
            platform_id: { type: [string, 'null'] }
            name: { type: [string, 'null'] }
        changed_fields: { type: array, items: { type: string } }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    LocationGroup:
      type: object
      required: [id, name, kind, location_count]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        kind: { $ref: '#/components/schemas/LocationGroupKind' }
        parent_id: { type: [string, 'null'] }
        rule:
          type: object
          properties:
            location_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
            filter: { type: object, additionalProperties: true }
        location_count: { type: integer }
    LocationGroupCreate:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { $ref: '#/components/schemas/LocationGroupKind' }
        parent_id: { type: [string, 'null'] }
        rule:
          type: object
          properties:
            location_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
            filter: { type: object, additionalProperties: true }
    LocationBulkRequest:
      type: object
      required: [patch]
      properties:
        location_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
        filter: { type: object, additionalProperties: true }
        patch: { $ref: '#/components/schemas/LocationPatch' }
    SyncBatch:
      type: object
      required: [id, kind, state, progress, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { type: string, enum: [bulk_edit, rollback, schedule, import, products, campaign_send] }
        state: { $ref: '#/components/schemas/BatchState' }
        progress:
          type: object
          required: [total, done, failed]
          properties:
            total: { type: integer }
            done: { type: integer }
            failed: { type: integer }
        initiator_user_id: { type: [string, 'null'] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        finished_at: { type: [string, 'null'], format: date-time }
    SyncBatchItem:
      type: object
      required: [operation_id, listing_id, location_id, platform_id, state]
      properties:
        operation_id: { $ref: '#/components/schemas/Id' }
        listing_id: { $ref: '#/components/schemas/Id' }
        location_id: { $ref: '#/components/schemas/Id' }
        platform_id: { $ref: '#/components/schemas/Id' }
        state: { $ref: '#/components/schemas/SyncOperationState' }
        error: { type: [string, 'null'] }
    PreviewSyncResponse:
      type: object
      description: Dry-run of what will be pushed after saving (SDD-02 §4).
      required: [available, listings]
      properties:
        available: { type: boolean }
        listings:
          type: array
          items:
            type: object
            required: [listing_id, platform_id, changes]
            properties:
              listing_id: { $ref: '#/components/schemas/Id' }
              platform_id: { $ref: '#/components/schemas/Id' }
              changes:
                type: array
                items:
                  type: object
                  required: [field]
                  properties:
                    field: { type: string }
                    from: {}
                    to: {}
                    note: { type: [string, 'null'] }
              warnings: { type: array, items: { type: string } }
    ImportUploadResponse:
      type: object
      required: [import_id, columns, sample_rows]
      properties:
        import_id: { $ref: '#/components/schemas/Id' }
        columns: { type: array, items: { type: string } }
        sample_rows:
          type: array
          items: { type: array, items: { type: [string, 'null'] } }
        row_count: { type: integer }
    ImportMappingRequest:
      type: object
      required: [mapping]
      properties:
        mapping:
          type: object
          description: column name → canonical field path (`name`, `address.city`, `branch_code`, …)
          additionalProperties: { type: string }
    ImportPreviewResponse:
      type: object
      required: [import_id, rows, summary]
      properties:
        import_id: { $ref: '#/components/schemas/Id' }
        summary:
          type: object
          required: [create, update, error]
          properties:
            create: { type: integer }
            update: { type: integer }
            error: { type: integer }
        rows:
          type: array
          items:
            type: object
            required: [row, action]
            properties:
              row: { type: integer }
              action: { type: string, enum: [create, update, error, skip] }
              location_id: { type: [string, 'null'] }
              branch_code: { type: [string, 'null'] }
              name: { type: [string, 'null'] }
              changes: { type: array, items: { type: string } }
              errors: { type: array, items: { type: string } }
    ImportApplyResponse:
      type: object
      required: [batch_id]
      properties:
        batch_id: { $ref: '#/components/schemas/Id' }

    # ── platforms, accounts, listings (SDD-00 §3.3, §5) ─────────────────────
    Capabilities:
      type: object
      description: Subset of connector capabilities relevant to the UI (SDD-00 §6.2).
      properties:
        listing:
          type: object
          properties:
            write: { type: boolean }
            create: { type: boolean }
            moderation: { type: string, enum: [none, async, manual] }
        reviews:
          type: object
          properties:
            reply: { type: boolean }
            delete_reply: { type: boolean }
            complain: { type: boolean }
            edits_visible: { type: boolean }
        questions: { type: object, properties: { answer: { type: boolean } } }
        media: { type: object, properties: { upload: { type: boolean }, delete: { type: boolean } } }
        publications:
          type: object
          properties:
            create: { type: boolean }
            types: { type: array, items: { $ref: '#/components/schemas/PublicationType' } }
        metrics:
          type: object
          properties:
            metrics: { type: array, items: { $ref: '#/components/schemas/Metric' } }
            granularity: { type: string, enum: [day, month] }
            latency_days: { type: integer }
        rank: { type: object, properties: { supported: { type: boolean } } }
    Platform:
      type: object
      required: [id, name, kind, countries, capabilities, health]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        kind: { $ref: '#/components/schemas/PlatformKind' }
        countries: { type: array, items: { type: string } }
        capabilities: { $ref: '#/components/schemas/Capabilities' }
        health: { $ref: '#/components/schemas/ConnectorHealth' }
        icon: { type: [string, 'null'], description: Icon key registered in the UI icon registry. }
        website: { type: [string, 'null'] }
    PlatformAccount:
      type: object
      required: [id, platform_id, auth_kind, status, listing_count]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        platform_id: { $ref: '#/components/schemas/Id' }
        auth_kind: { $ref: '#/components/schemas/PlatformAccountAuthKind' }
        status: { $ref: '#/components/schemas/PlatformAccountStatus' }
        display_name: { type: [string, 'null'] }
        external_account_id: { type: [string, 'null'] }
        listing_count: { type: integer }
        last_checked_at: { type: [string, 'null'], format: date-time }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    PlatformAccountCreate:
      type: object
      required: [platform_id, auth_kind]
      properties:
        platform_id: { $ref: '#/components/schemas/Id' }
        auth_kind: { $ref: '#/components/schemas/PlatformAccountAuthKind' }
        display_name: { type: string }
        credentials:
          type: object
          description: Only for `partner_key` / `credentials`; stored in the vault, never returned.
          additionalProperties: { type: string }
    OAuthStartResponse:
      type: object
      required: [redirect_url]
      properties:
        redirect_url: { type: string, format: uri }
    ListingStatusBrief:
      type: object
      required: [listing_id, platform_id, sync_status]
      properties:
        listing_id: { $ref: '#/components/schemas/Id' }
        platform_id: { $ref: '#/components/schemas/Id' }
        sync_status: { $ref: '#/components/schemas/SyncStatus' }
        action_reason: { $ref: '#/components/schemas/ActionReason' }
        url: { type: [string, 'null'] }
    ListingStatusCounts:
      type: object
      required: [synced, sent, action_required, not_connected, unsupported, error, total]
      properties:
        synced: { type: integer }
        sent: { type: integer }
        action_required: { type: integer }
        not_connected: { type: integer }
        unsupported: { type: integer }
        error: { type: integer }
        total: { type: integer }
    Listing:
      type: object
      required: [id, platform_id, ownership, verification, match_state, sync_status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        location_id: { type: [string, 'null'] }
        platform_id: { $ref: '#/components/schemas/Id' }
        platform_account_id: { type: [string, 'null'] }
        external_id: { type: [string, 'null'] }
        url: { type: [string, 'null'] }
        ownership: { $ref: '#/components/schemas/ListingOwnership' }
        verification: { $ref: '#/components/schemas/ListingVerification' }
        match_state: { $ref: '#/components/schemas/MatchState' }
        duplicate_of: { type: [string, 'null'] }
        match_score: { type: [number, 'null'] }
        sync_status: { $ref: '#/components/schemas/SyncStatus' }
        action_reason: { $ref: '#/components/schemas/ActionReason' }
        action_hint: { type: [string, 'null'], description: Human-readable CTA text for the action. }
        observed_name: { type: [string, 'null'] }
        observed_address: { type: [string, 'null'] }
        drift_fields: { type: array, items: { type: string } }
        last_snapshot_at: { type: [string, 'null'], format: date-time }
        last_seen_at: { type: [string, 'null'], format: date-time }
    ListingSummary:
      type: object
      description: Status counters for SCR-1 stat cards.
      required: [counts, by_platform]
      properties:
        counts: { $ref: '#/components/schemas/ListingStatusCounts' }
        by_platform:
          type: array
          items:
            type: object
            required: [platform_id, counts]
            properties:
              platform_id: { $ref: '#/components/schemas/Id' }
              counts: { $ref: '#/components/schemas/ListingStatusCounts' }
    ListingAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [retry, resolve_drift_accept_platform, resolve_drift_enforce, mark_manual_done, disconnect] }
        note: { type: string }
    SyncOperation:
      type: object
      required: [id, listing_id, state, created_at, attempts]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        listing_id: { $ref: '#/components/schemas/Id' }
        batch_id: { type: [string, 'null'] }
        patch:
          type: array
          items:
            type: object
            required: [field]
            properties:
              field: { type: string }
              from: {}
              to: {}
        state: { $ref: '#/components/schemas/SyncOperationState' }
        attempts: { type: integer }
        error: { type: [string, 'null'] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    SourceOverview:
      type: object
      description: Card of a platform on "Источники" (S-SRC-01) [H-UI-09].
      required: [platform, listing_counts, accounts]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        listing_counts: { $ref: '#/components/schemas/ListingStatusCounts' }
        accounts: { type: array, items: { $ref: '#/components/schemas/PlatformAccount' } }
        coverage_percent: { type: number, description: Locations with a listing on this platform / all locations in scope. }

    # ── reviews & communication (SDD-00 §3.4) ───────────────────────────────
    ReviewAuthor:
