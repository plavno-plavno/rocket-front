        created_at: { $ref: '#/components/schemas/Timestamp' }
    AnswerCreate:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1 }
    Conversation:
      type: object
      description: Multichat thread (S-COM-01) [H-UI-05].
      required: [id, platform_id, location_id, contact_name, last_message_at, unread_count, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        platform_id: { $ref: '#/components/schemas/Id' }
        location_id: { $ref: '#/components/schemas/Id' }
        location_name: { type: string }
        contact_name: { type: string }
        contact_avatar_url: { type: [string, 'null'] }
        last_message_preview: { type: [string, 'null'] }
        last_message_at: { $ref: '#/components/schemas/Timestamp' }
        unread_count: { type: integer }
        status: { type: string, enum: [open, closed] }
        assignee_user_id: { type: [string, 'null'] }
    ConversationMessage:
      type: object
      required: [id, conversation_id, direction, text, sent_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        conversation_id: { $ref: '#/components/schemas/Id' }
        direction: { type: string, enum: [inbound, outbound] }
        author_user_id: { type: [string, 'null'] }
        text: { type: string }
        attachments:
          type: array
          items:
            type: object
            required: [url, kind]
            properties:
              url: { type: string }
              kind: { type: string, enum: [image, file] }
              name: { type: [string, 'null'] }
        state: { $ref: '#/components/schemas/ReplyState' }
