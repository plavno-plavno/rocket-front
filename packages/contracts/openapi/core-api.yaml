        ingested_at: { $ref: '#/components/schemas/Timestamp' }
        current_version: { type: integer }
        platform_state: { $ref: '#/components/schemas/ReviewPlatformState' }
        workflow_status: { $ref: '#/components/schemas/ReviewWorkflowStatus' }
