      type: object
      required: [user_id, name, replies, avg_response_time_s]
      properties:
        user_id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        replies: { type: integer }
        avg_response_time_s: { type: [integer, 'null'] }
        resolved: { type: integer }
