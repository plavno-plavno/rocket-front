        location_id: { $ref: '#/components/schemas/Id' }
        platform_id: { $ref: '#/components/schemas/Id' }
        author_name: { type: string }
        rating: { type: [integer, 'null'] }
        text: { type: [string, 'null'] }
        published_at: { $ref: '#/components/schemas/Timestamp' }
    ReviewVersion:
      type: object
      required: [version, rating, text, observed_at]
      properties:
        version: { type: integer }
        rating: { type: [integer, 'null'] }
        text: { type: [string, 'null'] }
        observed_at: { $ref: '#/components/schemas/Timestamp' }
    ReviewSummary:
      type: object
      description: KPI row of the inbox (SCR-3).
      required: [total, positive, negative, without_rating, average_rating, unanswered]
      properties:
        total: { type: integer }
        positive: { type: integer }
        negative: { type: integer }
        without_rating: { type: integer }
        average_rating: { type: [number, 'null'] }
        unanswered: { type: integer }
    ReviewReply:
      type: object
      required: [id, review_id, origin, text, state, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        review_id: { $ref: '#/components/schemas/Id' }
        author_user_id: { type: [string, 'null'] }
        author_name: { type: [string, 'null'] }
        origin: { $ref: '#/components/schemas/ReplyOrigin' }
        text: { type: string }
        state: { $ref: '#/components/schemas/ReplyState' }
        published_at: { type: [string, 'null'], format: date-time }
        external_id: { type: [string, 'null'] }
        error: { type: [string, 'null'] }
        response_time_s: { type: [integer, 'null'] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    ReviewReplyCreate:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1 }
        origin: { $ref: '#/components/schemas/ReplyOrigin' }
