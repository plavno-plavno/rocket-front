      type: object
      required: [open, duplicates, fakes, conflicting_owner]
      properties:
        open: { type: integer }
        duplicates: { type: integer }
        fakes: { type: integer }
        conflicting_owner: { type: integer }

    # ── notifications, integrations, exports ───────────────────────────────
    Notification:
      type: object
      required: [id, type, title, body, read, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        type: { $ref: '#/components/schemas/NotificationType' }
        title: { type: string }
        body: { type: string }
        read: { type: boolean }
        link: { type: [string, 'null'], description: In-app path }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    NotificationSettings:
      type: object
      required: [rules, channels]
      properties:
        rules:
          type: array
          items:
            type: object
            required: [type, enabled, channels]
            properties:
              type: { $ref: '#/components/schemas/Notification/properties/type' }
              enabled: { type: boolean }
              channels: { type: array, items: { $ref: '#/components/schemas/NotificationChannel' } }
              threshold_hours: { type: [integer, 'null'] }
        channels:
          type: object
          properties:
            email: { type: object, properties: { enabled: { type: boolean }, digest: { type: string, enum: [instant, daily, weekly] } } }
            telegram: { type: object, properties: { enabled: { type: boolean }, linked: { type: boolean }, deeplink: { type: [string, 'null'] } } }
            web_push: { type: object, properties: { enabled: { type: boolean } } }
        quiet_hours:
          type: [object, 'null']
          properties:
            from: { type: string }
            to: { type: string }
    ApiKey:
      type: object
      required: [id, name, prefix, scopes, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        prefix: { type: string, description: 'First characters, e.g. `lp_live_ab12`' }
        scopes: { type: array, items: { type: string } }
        last_used_at: { type: [string, 'null'], format: date-time }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    ApiKeyCreate:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string }
        scopes: { type: array, items: { type: string } }
    ApiKeyCreated:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [secret]
          properties:
            secret: { type: string, description: Shown once. }
    Webhook:
      type: object
      required: [id, url, events, enabled, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        url: { type: string, format: uri }
        events: { type: array, items: { type: string, enum: [review.created, review.updated, reply.published, listing.action_required] } }
        enabled: { type: boolean }
        secret_prefix: { type: [string, 'null'] }
        last_delivery_at: { type: [string, 'null'], format: date-time }
        last_delivery_status: { type: [integer, 'null'] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    WebhookUpsert:
      type: object
      required: [url, events]
      properties:
        url: { type: string, format: uri }
        events: { $ref: '#/components/schemas/Webhook/properties/events' }
        enabled: { type: boolean, default: true }
    WebhookDelivery:
      type: object
      required: [id, event, status, attempted_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        event: { type: string }
        status: { type: integer }
        attempted_at: { $ref: '#/components/schemas/Timestamp' }
        error: { type: [string, 'null'] }
    Export:
      type: object
      required: [id, kind, state, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { type: string, enum: [locations, reviews, review_analytics, presence, rank, qr_pdf] }
        state: { $ref: '#/components/schemas/ExportState' }
        download_url: { type: [string, 'null'] }
        expires_at: { type: [string, 'null'], format: date-time }
        error: { type: [string, 'null'] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    ExportCreate:
      type: object
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/Export/properties/kind' }
        format: { type: string, enum: [xlsx, csv, pdf], default: xlsx }
        params: { type: object, additionalProperties: true, description: Filters of the source screen. }
    FieldPolicySetting:
      type: object
      required: [field, policy]
      properties:
        field: { type: string }
        policy: { $ref: '#/components/schemas/FieldPolicy' }
    SourceSettings:
      type: object
      description: Settings → Настройка источников (S-SET-06).
      required: [field_policies, platforms]
      properties:
        field_policies: { type: array, items: { $ref: '#/components/schemas/FieldPolicySetting' } }
        platforms:
          type: array
          items:
            type: object
            required: [platform_id, enabled]
            properties:
              platform_id: { $ref: '#/components/schemas/Id' }
              enabled: { type: boolean }
              auto_reply_enabled: { type: boolean }

