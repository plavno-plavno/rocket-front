        name: { type: string }
        appearances: { type: integer }
        avg_rank: { type: number }

    # ── duplicates (SDD-04) ─────────────────────────────────────────────────
    DuplicateCase:
      type: object
      required: [id, kind, state, platform_id, location_id, listing, score, reasons, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/DuplicateKind' }
        state: { $ref: '#/components/schemas/DuplicateState' }
        platform_id: { $ref: '#/components/schemas/Id' }
        location_id: { $ref: '#/components/schemas/Id' }
        location_name: { type: string }
        listing: { $ref: '#/components/schemas/Listing' }
        score: { type: number, description: 0..1 }
        reasons:
          type: array
          items:
            type: object
            required: [feature, weight, detail]
            properties:
              feature: { type: string }
              weight: { type: number }
              detail: { type: string }
        comparison:
          type: array
          items:
            type: object
            required: [field, ours, theirs, match]
            properties:
              field: { type: string }
              ours: { type: [string, 'null'] }
              theirs: { type: [string, 'null'] }
              match: { type: boolean }
        distance_m: { type: [number, 'null'] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        resolved_at: { type: [string, 'null'], format: date-time }
    DuplicateAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [confirm_duplicate, dismiss, report_fake, merge, claim] }
        note: { type: string }
