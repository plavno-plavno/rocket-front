    ConversationMessageCreate:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1 }

    # ── content (SDD-00 §3.5) ────────────────────────────────────────────────
    PublicationResult:
      type: object
      required: [listing_id, platform_id, state]
      properties:
        listing_id: { $ref: '#/components/schemas/Id' }
        platform_id: { $ref: '#/components/schemas/Id' }
        state: { type: string, enum: [queued, sent, published, rejected, failed] }
