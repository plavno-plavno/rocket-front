    AiGenerateResponse:
      type: object
      required: [variants]
      properties:
        variants: { type: array, items: { type: string } }
    Question:
      type: object
      required: [id, listing_id, location_id, platform_id, author, text, published_at, workflow_status, answer_count]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        listing_id: { $ref: '#/components/schemas/Id' }
        location_id: { $ref: '#/components/schemas/Id' }
