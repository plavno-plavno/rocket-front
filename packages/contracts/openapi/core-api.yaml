        impressions: { type: integer }
        month: { type: string, description: YYYY-MM }
        platform_id: { $ref: '#/components/schemas/Id' }
        trend_percent: { type: [number, 'null'] }
    RankProject:
      type: object
      required: [id, name, platform_ids, keywords, grid, schedule, scope, status, created_at]
