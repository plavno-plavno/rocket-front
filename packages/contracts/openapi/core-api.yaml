      type: object
      properties:
        location_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
        scope: { type: string }
        layout: { type: string, enum: [a4_poster, table_tent, sticker], default: a4_poster }
    Widget:
      type: object
      required: [id, kind, name, config, public_key, allowed_domains, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/WidgetKind' }
        name: { type: string }
        config: { $ref: '#/components/schemas/WidgetConfig' }
        public_key: { type: string }
        allowed_domains: { type: array, items: { type: string } }
