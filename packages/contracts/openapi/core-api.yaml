      type: object
      description: SCR-4 KPI row.
      required: [period, total, complaints, edited_by_users, deleted_by_users, answered_share, avg_response_time_s, average_rating]
      properties:
        period: { $ref: '#/components/schemas/Period' }
        total: { $ref: '#/components/schemas/KpiValue' }
        complaints: { $ref: '#/components/schemas/KpiValue' }
        edited_by_users: { $ref: '#/components/schemas/KpiValue' }
        deleted_by_users: { $ref: '#/components/schemas/KpiValue' }
