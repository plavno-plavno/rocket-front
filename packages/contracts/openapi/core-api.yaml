        workflow_status: { $ref: '#/components/schemas/ReviewWorkflowStatus' }
        assignee_user_id: { type: [string, 'null'] }
        tag_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
    ReviewCreateManual:
      type: object
      description: Manual review entry [H-UI-06].
      required: [location_id, platform_id, rating, published_at]
