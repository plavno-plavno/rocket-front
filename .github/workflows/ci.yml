name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  NEXT_PUBLIC_SENTRY_DISABLED: 'true'

jobs:
  checks:
    name: typecheck · lint · format · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Contracts (lint + generated types drift)
        run: pnpm contracts:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (strict)
        run: pnpm lint:strict

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build
        env:
          CORE_API_URL: http://localhost:4010
