name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  NEXT_PUBLIC_SENTRY_DISABLED: 'true'

jobs:
  checks:
    name: typecheck · lint · format · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Contracts (lint + generated types drift)
        run: pnpm contracts:check

      - name: Generated registries (gen --check)
        run: pnpm --filter @lp/web gen:check

      - name: Page templates (check:templates)
        run: pnpm --filter @lp/web check:templates

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (strict)
        run: pnpm lint:strict

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build
        env:
          CORE_API_URL: http://localhost:4100

      - name: Install Playwright browsers
        run: pnpm --filter @lp/web exec playwright install --with-deps chromium

      - name: E2E (mock core-api)
        run: pnpm --filter @lp/web e2e
        env:
          CI: 'true'
          E2E_SKIP_BUILD: '1'
          WEB_PORT: '3100'
          MOCK_PORT: '4100'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
